<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analysis</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="container"><a href="{{ url_for('dashboard') }}">بازگشت به داشبورد</a><h1>تحلیل پست</h1><section class="stats"><article><b>{{ result.likes }}</b><span>لایک</span></article><article><b>{{ result.comments }}</b><span>کامنت</span></article><article><b>{{ result.engagement_rate }}%</b><span>نرخ تعامل</span></article><article><b>{{ result.caption_length }}</b><span>طول کپشن</span></article></section><section class="guide"><h2>پیشنهادهای سیستم</h2><ul>{% for item in result.recommendations %}<li>{{ item }}</li>{% endfor %}</ul></section></main></body></html>
